<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Human Problem Engine - Problemleri bul, çözümleri keşfet, ücretsiz araçları kullan.">
  <title>Human Problem Engine</title>
</head>

<body>

  <header>
    <h1>Human Problem Engine</h1>
    <p>Problemini bul. Çözümünü keşfet.</p>
  </header>

  <main>

    <section>
      <h2>Problemini yaz</h2>

      <input
        type="text"
        id="problemInput"
        placeholder="Örn: Paramı yönetemiyorum"
      >

      <button id="searchButton">
        Çözümü Bul
      </button>
    </section>

    <section>
      <h2>Popüler Problemler</h2>

      <div class="popular-problems">

  <button class="problem-example" data-problem="Paramı yönetemiyorum">
    💰 Para
  </button>

  <button class="problem-example" data-problem="İş bulamıyorum">
    💼 İş ve Kariyer
  </button>

  <button class="problem-example" data-problem="Zamanımı yönetemiyorum">
    ⏰ Zaman
  </button>

  <button class="problem-example" data-problem="Sınava hazırlanmakta zorlanıyorum">
    📚 Eğitim
  </button>

  <button class="problem-example" data-problem="Bilgisayarımda sorun var">
    💻 Teknoloji
  </button>

  <button class="problem-example" data-problem="Günlük işlerimi düzenleyemiyorum">
    🏠 Günlük Yaşam
  </button>

      </div>
    </section>

    <section>
      <h2>Ücretsiz Araçlar</h2>

      <ul>
        <li>🧮 Hesaplayıcılar</li>
        <li>📝 Metin Araçları</li>
        <li>💻 Web Araçları</li>
        <li>📄 Dosya Araçları</li>
      </ul>
    </section>

  </main>

  <footer>
    <p>Human Problem Engine</p>
    <p>Ücretsiz problem ve çözüm platformu.</p>
  </footer>
  
<script src="script.js"></script>
  
</body>
</html>
